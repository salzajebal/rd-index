services:
  - type: web
    name: vora-markets
    env: node
    region: singapore   # 한국과 가장 가까운 Render 리전
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # Render 대시보드에서 직접 입력
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_PERSONAL_ACCESS_TOKEN
        sync: false
